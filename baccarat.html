<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07130f"><title>NEXORA Baccarat Royale</title><link rel="stylesheet" href="baccarat.css?v=2"></head><body><div class="game-shell"><header class="game-topbar"><a class="back-btn" href="index.html">←</a><div class="game-title"><span class="eyebrow">NEXORA</span><strong>Baccarat Royale</strong></div><div class="wallet"><span>NXC</span><strong id="gameBalance">0</strong></div></header><main><section id="tableWrap" class="table-wrap"><div class="scoreboard"><div class="score player-score"><span>PLAYER</span><strong id="playerScore">0</strong></div><div class="round-state" id="roundState">CHỌN CỬA</div><div class="score banker-score"><span>BANKER</span><strong id="bankerScore">0</strong></div></div><div class="hands"><div class="hand-side"><span class="side-label player">PLAYER</span><div id="playerHand" class="card-row"></div></div><div class="versus">VS</div><div class="hand-side"><span class="side-label banker">BANKER</span><div id="bankerHand" class="card-row"></div></div></div><div id="resultBanner" class="result-banner hidden"></div><div class="bet-zones"><button class="bet-zone player-zone" data-bet="player"><span>PLAYER</span><strong>1 : 1</strong><small id="betPlayer">0 NXC</small></button><button class="bet-zone tie-zone" data-bet="tie"><span>TIE</span><strong>8 : 1</strong><small id="betTie">0 NXC</small></button><button class="bet-zone banker-zone" data-bet="banker"><span>BANKER</span><strong>0.95 : 1</strong><small id="betBanker">0 NXC</small></button></div></section><section class="controls"><div class="chip-row"><button class="chip active" data-chip="100">100</button><button class="chip" data-chip="500">500</button><button class="chip" data-chip="1000">1K</button><button class="chip" data-chip="5000">5K</button></div><div class="action-row"><button id="clearBets" class="btn ghost">Xóa cược</button><button id="dealBtn" class="btn gold" disabled>ĐANG NHẬN CƯỢC</button> id="replayBtn" class="btn replay hidden">CHƠI LẠI CƯỢC TRƯỚC</button><p class="fineprint">NXC chỉ là điểm ảo trong game, không có giá trị tiền mặt và không thể nạp/rút hay quy đổi.</p></section><section class="history-panel"><div class="history-head"><div><span class="eyebrow">LỊCH SỬ</span><h2>Ván gần đây</h2></div><button id="clearHistory" class="mini-btn" type="button">Xóa</button></div><div id="roundHistory" class="history-list"><p class="empty">Chưa có ván nào.</p></div></section></main><div id="toast" class="toast"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><script src="baccarat.js?v=3"></script></script></body></html>
