<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#06120e">

  <title>NEXORA | Baccarat Royale</title>

  <!-- CSS Baccarat -->
  <link rel="stylesheet" href="baccarat.css?v=8">
</head>

<body>

<div class="game-shell">

  <!-- HEADER -->
  <header class="game-topbar">

    <a class="back-btn" href="index.html" aria-label="Quay lại">
      ←
    </a>

    <div class="game-title">
      <span class="eyebrow">NEXORA</span>
      <strong>Baccarat Royale</strong>
    </div>

    <div class="wallet">
      <span>NXC</span>
      <strong id="walletBalance">0</strong>
    </div>

  </header>


  <main>

    <!-- BÀN BACCARAT -->
    <section id="tableWrap" class="table-wrap">

      <!-- ĐIỂM -->
      <div class="scoreboard">

        <div class="score player-score">
          <span>PLAYER</span>
          <strong id="playerScore">0</strong>
        </div>

        <div id="roundState" class="round-state">
          CHỜ ĐẶT CƯỢC
        </div>

        <div class="score banker-score">
          <span>BANKER</span>
          <strong id="bankerScore">0</strong>
        </div>

      </div>


      <!-- KHU VỰC BÀI -->
      <div class="hands">

        <div class="hand-side">

          <div class="side-label player">
            PLAYER
          </div>

          <div
            id="playerCards"
            class="card-row"
          ></div>

        </div>


        <div class="versus">
          VS
        </div>


        <div class="hand-side">

          <div class="side-label banker">
            BANKER
          </div>

          <div
            id="bankerCards"
            class="card-row"
          ></div>

        </div>

      </div>


      <!-- THÔNG BÁO KẾT QUẢ -->
      <div
        id="resultBanner"
        class="result-banner hidden"
      ></div>


      <!-- KHU VỰC CƯỢC -->
      <div class="bet-zones">

        <button
          class="bet-zone player-zone"
          data-bet="PLAYER"
          type="button"
        >
          <span>PLAYER</span>
          <strong>1 : 1</strong>
          <small>
            <b id="playerBet">0</b> NXC
          </small>
        </button>


        <button
          class="bet-zone tie-zone"
          data-bet="TIE"
          type="button"
        >
          <span>TIE</span>
          <strong>8 : 1</strong>
          <small>
            <b id="tieBet">0</b> NXC
          </small>
        </button>


        <button
          class="bet-zone banker-zone"
          data-bet="BANKER"
          type="button"
        >
          <span>BANKER</span>
          <strong>0.95 : 1</strong>
          <small>
            <b id="bankerBet">0</b> NXC
          </small>
        </button>

      </div>

    </section>


    <!-- CHIP + NÚT -->
    <section class="controls">

      <div class="chip-row">

        <button
          class="chip active"
          data-chip="100"
          type="button"
        >
          100
        </button>

        <button
          class="chip"
          data-chip="500"
          type="button"
        >
          500
        </button>

        <button
          class="chip"
          data-chip="1000"
          type="button"
        >
          1K
        </button>

        <button
          class="chip"
          data-chip="5000"
          type="button"
        >
          5K
        </button>

      </div>


      <div class="action-row">

        <button
          id="clearBets"
          class="btn secondary"
          type="button"
        >
          Xóa cược
        </button>


        <button
          id="dealBtn"
          class="btn gold"
          type="button"
          disabled
        >
          ĐANG NHẬN CƯỢC
        </button>

      </div>


      <button
        id="replayBtn"
        class="btn replay hidden"
        type="button"
      >
        CHƠI LẠI CƯỢC TRƯỚC
      </button>


      <p class="fineprint">
        NXC chỉ là điểm ảo trong game,
        không có giá trị tiền mặt và
        không thể nạp/rút hay quy đổi.
      </p>

    </section>


    <!-- LỊCH SỬ -->
    <section class="history-panel">

      <div class="history-head">

        <div>
          <span class="eyebrow">
            LỊCH SỬ
          </span>

          <h2>Ván gần đây</h2>
        </div>


        <button
          id="clearHistory"
          class="mini-btn"
          type="button"
        >
          Xóa
        </button>

      </div>


      <div
        id="historyList"
        class="history-list"
      >
        <p class="empty">
          Chưa có ván nào.
        </p>
      </div>

    </section>

  </main>

</div>


<!-- THÔNG BÁO -->
<div
  id="toast"
  class="toast"
></div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- GAME JS -->
<script src="baccarat.js?v=8"></script>

</body>
</html>
